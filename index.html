<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Learning Game</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <header class="app-header">
    <h1>🎮 English Learning Game</h1>
    <p class="subtitle">Pick a game and start learning!</p>
  </header>

  <main id="app">
    <section id="home-screen" class="screen">
      <div id="game-grid" class="game-grid"></div>
    </section>

    <section id="game-screen" class="screen hidden">
      <button id="back-btn" class="back-btn">← Back to games</button>
      <div id="game-container"></div>
    </section>
  </main>

  <script>window.GAMES = [];</script>
  <script src="data/vocabulary.js"></script>
  <script src="data/grammar.js"></script>
  <script src="data/prepositions.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/games/prepositions.js"></script>
  <script src="js/games/vocabulary.js"></script>
  <script src="js/games/grammar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
