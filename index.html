<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Learning Game</title>
<link rel="stylesheet" href="css/style.css?v=8">
<link rel="stylesheet" href="css/learn.css?v=8">
<link rel="stylesheet" href="css/games.css?v=8">
</head>
<body>
  <header class="app-header">
    <h1>📚 English for Russian Speakers</h1>
    <p class="subtitle">Английский для русскоговорящих · A0 → A1+</p>
    <nav class="tab-nav">
      <button id="tab-learn" class="tab-btn active">📖 Learn</button>
      <button id="tab-practice" class="tab-btn">🎮 Practice</button>
    </nav>
  </header>

  <main id="app">
    <section id="learn-section" class="screen"></section>

    <section id="practice-section" class="screen hidden">
      <section id="home-screen" class="screen">
        <div id="game-grid" class="game-grid"></div>
      </section>
    </section>

    <div id="load-error" class="load-error hidden">
      <p>⚠️ Something didn't load properly.</p>
      <button id="load-error-retry" onclick="location.reload()">Tap to reload</button>
    </div>

    <section id="game-screen" class="screen hidden">
      <button id="back-btn" class="back-btn">← Back to games</button>
      <div id="game-container"></div>
    </section>
  </main>

  <script>
    window.GAMES = [];
    window.__appInitialized = false;
    window.__showLoadError = function () {
      var el = document.getElementById('load-error');
      if (el) el.classList.remove('hidden');
    };
    window.addEventListener('error', function () {
      if (!window.__appInitialized) window.__showLoadError();
    });
    // Fallback: if nothing has initialized within a few seconds
    // (e.g. a script failed to load without throwing a JS error),
    // show a retry prompt instead of leaving the page blank.
    setTimeout(function () {
      if (!window.__appInitialized) window.__showLoadError();
    }, 4000);
  </script>
  <!-- Data files -->
  <script src="data/vocabulary.js?v=8"></script>
  <script src="data/prepositions.js?v=8"></script>
  <script src="data/sentences.js?v=8"></script>
  <script src="data/lessons.js?v=8"></script>
  <script src="data/a0-content.js?v=8"></script>
  <script src="data/a1-content.js?v=8"></script>
  <script src="data/grammar-topics.js?v=8"></script>
  <script src="data/verb-builder.js?v=8"></script>
  <!-- Engines -->
  <script src="js/quiz-engine.js?v=8"></script>
  <script src="js/sentence-builder.js?v=8"></script>
  <script src="js/lesson-runner.js?v=8"></script>
  <script src="js/learn-viewer.js?v=8"></script>
  <!-- Game modules -->
  <script src="js/games/prepositions.js?v=8"></script>
  <script src="js/games/vocabulary.js?v=8"></script>
  <script src="js/games/grammar.js?v=8"></script>
  <script src="js/games/sentences.js?v=8"></script>
  <script src="js/games/wordwall.js?v=8"></script>
  <script src="js/games/flashcard.js?v=8"></script>
  <script src="js/games/typeit.js?v=8"></script>
  <script src="js/games/fillgap.js?v=8"></script>
  <script src="js/games/hangman.js?v=8"></script>
  <script src="js/games/spinwheel.js?v=8"></script>
  <script src="js/games/grammar-quiz.js?v=8"></script>
  <script src="js/games/memorymatch.js?v=8"></script>
  <script src="js/games/verb-builder.js?v=8"></script>
  <!-- App init -->
  <script src="js/app.js?v=8"></script>
</body>
</html>
