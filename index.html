<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Learning Game</title>
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="stylesheet" href="css/learn.css?v=4">
<link rel="stylesheet" href="css/games.css?v=3">
</head>
<body>
  <header class="app-header">
    <h1>📚 English for Russian Speakers</h1>
    <p class="subtitle">Английский для русскоговорящих · A0 → A1+</p>
    <nav class="tab-nav">
      <button id="tab-learn" class="tab-btn active">📖 Learn</button>
      <button id="tab-practice" class="tab-btn">🎮 Practice</button>
    </nav>
  </header>

  <main id="app">
    <section id="learn-section" class="screen"></section>

    <section id="practice-section" class="screen hidden">
      <section id="home-screen" class="screen">
        <div id="game-grid" class="game-grid"></div>
      </section>
    </section>

    <section id="game-screen" class="screen hidden">
      <button id="back-btn" class="back-btn">← Back to games</button>
      <div id="game-container"></div>
    </section>
  </main>

  <script>window.GAMES = [];</script>
  <!-- Data files -->
  <script src="data/vocabulary.js?v=4"></script>
  <script src="data/prepositions.js"></script>
  <script src="data/sentences.js"></script>
  <script src="data/lessons.js"></script>
  <script src="data/a0-content.js?v=2"></script>
  <script src="data/a1-content.js?v=5"></script>
  <script src="data/grammar-topics.js"></script>
  <!-- Engines -->
  <script src="js/quiz-engine.js"></script>
  <script src="js/sentence-builder.js"></script>
  <script src="js/lesson-runner.js"></script>
  <script src="js/learn-viewer.js?v=6"></script>
  <!-- Game modules -->
  <script src="js/games/prepositions.js"></script>
  <script src="js/games/vocabulary.js"></script>
  <script src="js/games/grammar.js"></script>
  <script src="js/games/sentences.js"></script>
  <!-- Arcade games -->
  <script src="js/games/wordwall.js"></script>
  <script src="js/games/flashcard.js"></script>
  <script src="js/games/typeit.js"></script>
  <script src="js/games/fillgap.js"></script>
  <script src="js/games/hangman.js"></script>
  <script src="js/games/spinwheel.js"></script>
  <script src="js/games/grammar-quiz.js"></script>
  <script src="js/games/memorymatch.js"></script>
  <script src="data/verb-builder.js"></script>
  <script src="js/games/verb-builder.js"></script>
  <!-- App init -->
  <script src="js/app.js?v=3"></script>
</body>
</html>
